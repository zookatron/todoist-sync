services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: todoist_sync
      POSTGRES_PASSWORD: todoist_sync
      POSTGRES_DB: todoist_sync
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U todoist_sync']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # Applies drizzle migrations and, if INITIAL_USER_EMAIL/INITIAL_USER_PASSWORD are set,
  # seeds the single user — then serves a health check indefinitely so `web` and `worker`
  # can depend on schema readiness without racing each other to migrate.
  migrate:
    build: .
    restart: unless-stopped
    command: yarn migrate
    env_file: .env
    environment:
      DATABASE_URL: postgres://todoist_sync:todoist_sync@postgres:5432/todoist_sync
      REDIS_URL: redis://redis:6379
      # All three services append to this one file on a shared volume, so a sync problem
      # reads as a single timeline instead of two you have to correlate by hand. Each line
      # carries its writer's pid.
      LOG_FILE: /app/logs/app.log
    volumes:
      - logs:/app/logs
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:3001/healthz']
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    command: yarn start
    env_file: .env
    environment:
      DATABASE_URL: postgres://todoist_sync:todoist_sync@postgres:5432/todoist_sync
      REDIS_URL: redis://redis:6379
      LOG_FILE: /app/logs/app.log
    volumes:
      - logs:/app/logs
    ports:
      - '3000:3000'
    depends_on:
      migrate: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: .
    restart: unless-stopped
    command: yarn worker
    env_file: .env
    environment:
      DATABASE_URL: postgres://todoist_sync:todoist_sync@postgres:5432/todoist_sync
      REDIS_URL: redis://redis:6379
      LOG_FILE: /app/logs/app.log
    volumes:
      - logs:/app/logs
    depends_on:
      migrate: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  postgres_data:
  redis_data:
  logs:
