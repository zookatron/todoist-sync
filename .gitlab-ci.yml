# Initial GitLab CI setup: checks on every push/MR, deploy-to-VPS-over-SSH on every push
# to the "production" branch.
#
# Mark "production" as a protected branch (Settings → Repository → Protected branches) so
# only it can push there, and so the CI/CD variables below — masked and protected — are
# only ever exposed to pipelines running on it:
#   DEPLOY_SSH_HOST         VPS hostname or IP
#   DEPLOY_SSH_USER         SSH user on the VPS
#   DEPLOY_SSH_PORT         optional, defaults to 22
#   DEPLOY_SSH_PRIVATE_KEY  private key for that user (an OpenSSH-format PEM). Give this
#                           key's *public* half to the VPS user's ~/.ssh/authorized_keys.
#   DEPLOY_SSH_PATH         absolute path to the git checkout on the VPS, e.g.
#                           /home/deploy/todoist-sync — must already be `git clone`d there
#                           with a remote it can pull from non-interactively, and must
#                           already have a `.env` (see .env.example) for docker-compose to
#                           read.

stages:
  - test
  - deploy

variables:
  POSTGRES_USER: todoist_sync
  POSTGRES_PASSWORD: todoist_sync
  POSTGRES_DB: todoist_sync
  DATABASE_URL: postgres://todoist_sync:todoist_sync@postgres:5432/todoist_sync
  REDIS_URL: redis://redis:6379
  BETTER_AUTH_SECRET: ci-secret-value-that-is-at-least-32-chars
  BETTER_AUTH_URL: http://localhost:5173
  TODOIST_CLIENT_ID: ci-client-id
  TODOIST_CLIENT_SECRET: ci-client-secret
  TODOIST_REDIRECT_URI: http://localhost:5173/oauth/todoist/callback

test:
  stage: test
  image: node:24-alpine
  script:
    - corepack enable
    - yarn install --immutable
    - yarn react-router typegen
    - yarn check
    - yarn test
    - yarn build

# Reruns the same two commands the README documents for a manual deploy — this job just
# does it over SSH instead of you typing it at the VPS, automatically on every push to
# "production". Merge (or push) to that branch is the deploy trigger; there is no separate
# manual step.
deploy:
  stage: deploy
  image: alpine:3.21
  needs: ['test']
  rules:
    - if: '$CI_COMMIT_BRANCH == "production"'
  resource_group: production
  environment:
    name: production
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$DEPLOY_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -p "${DEPLOY_SSH_PORT:-22}" -H "$DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - >
      ssh -p "${DEPLOY_SSH_PORT:-22}" "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST"
      "cd $DEPLOY_SSH_PATH && git fetch && git reset --hard origin/production && docker compose up -d --build"
