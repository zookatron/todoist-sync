# Plug'n'Play is Yarn's default, but this project's toolchain (Vite, React Router's
# framework build, drizzle-kit, esbuild's --packages=external worker bundle) all
# resolve through a real node_modules tree, and the Dockerfile copies node_modules
# between build stages. Keep the classic linker.
nodeLinker: node-modules

# Yarn 4 caches globally by default; nothing large lands in the repo.
enableGlobalCache: true

# `@better-auth/drizzle-adapter` declares @better-auth/core and @better-auth/utils as
# peers. We import the adapter directly, so Yarn wants the workspace to supply them —
# but `better-auth` already depends on both, and they hoist to the root of
# node_modules where the adapter resolves them fine. Declaring them here at the
# workspace level would only drag in @better-auth/core's own five peers
# (@better-fetch/fetch, better-call, jose, kysely, nanostores), none of which this app
# imports. Demote the two warnings instead of growing package.json with phantom deps.
logFilters:
  - pattern: '*doesn*t provide @better-auth/core*'
    level: discard
  - pattern: '*doesn*t provide @better-auth/utils*'
    level: discard
