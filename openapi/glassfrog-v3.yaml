    patch:
      tags: [Agenda Items]
      summary: Update an agenda item
      parameters:
        - $ref: '#/components/parameters/resourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/PatchOperation' }
      responses:
        '204': { description: Agenda item updated }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    delete:
      tags: [Agenda Items]
      summary: Delete an agenda item
      parameters:
        - $ref: '#/components/parameters/resourceId'
      responses:
        '204': { description: Agenda item deleted }
        '403': { $ref: '#/components/responses/Forbidden' }

  /meetings/{meeting_id}/agenda_items:
    get:
      tags: [Agenda Items]
      summary: List agenda items in a meeting
      parameters:
        - name: meeting_id
          in: path
          required: true
          schema: { type: integer }
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
      responses:
        '200':
          description: Agenda items in the meeting
          content:
            application/json:
              schema:
                type: object
                properties:
                  agenda_items:
                    type: array
                    items: { $ref: '#/components/schemas/AgendaItem' }

  # ── Proposals ──────────────────────────────────────────────────────────
  /proposals:
    get:
      tags: [Proposals]
      summary: List proposals
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/include'
        - name: circle_id
          in: query
          schema: { type: integer }
        - name: person_id
          in: query
          schema: { type: integer }
        - name: status
          in: query
          schema: { type: string }
          description: Filter by proposal status.
      responses:
        '200':
          description: A list of proposals
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposals:
                    type: array
                    items: { $ref: '#/components/schemas/Proposal' }
                  linked:
                    $ref: '#/components/schemas/LinkedResources'

  /proposals/{id}:
    get:
      tags: [Proposals]
      summary: Get a proposal
      parameters:
        - $ref: '#/components/parameters/resourceId'
        - $ref: '#/components/parameters/include'
      responses:
        '200':
          description: A single proposal
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposals:
                    type: array
                    items: { $ref: '#/components/schemas/Proposal' }
                    minItems: 1
                    maxItems: 1
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Proposals]
      summary: Update a proposal
      parameters:
        - $ref: '#/components/parameters/resourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/PatchOperation' }
      responses:
        '204': { description: Proposal updated }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    delete:
      tags: [Proposals]
      summary: Delete a proposal
      parameters:
        - $ref: '#/components/parameters/resourceId'
      responses:
        '204': { description: Proposal deleted }
        '403': { $ref: '#/components/responses/Forbidden' }

  /proposals/{id}/responses:
    post:
      tags: [Proposals]
      summary: Respond to a proposal
      parameters:
        - $ref: '#/components/parameters/resourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: string
                  description: The response value.
      responses:
        '201': { description: Response recorded }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Proposals]
      summary: Retract a proposal response
      parameters:
        - $ref: '#/components/parameters/resourceId'
      responses:
        '204': { description: Response retracted }

  /tensions/{tension_id}/proposals:
    get:
      tags: [Proposals]
      summary: List proposals for a tension
      parameters:
        - name: tension_id
          in: path
          required: true
          schema: { type: integer }
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
      responses:
        '200':
          description: Proposals for the tension
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposals:
                    type: array
                    items: { $ref: '#/components/schemas/Proposal' }

  # ── Triggers ───────────────────────────────────────────────────────────
  /triggers:
    get:
      tags: [Triggers]
      summary: List triggers
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - name: circle_id
          in: query
          schema: { type: integer }
        - name: person_id
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: A list of triggers
          content:
            application/json:
              schema:
                type: object
                properties:
                  triggers:
                    type: array
                    items: { $ref: '#/components/schemas/Trigger' }

  /circles/{circle_id}/triggers:
    get:
      tags: [Triggers]
      summary: List triggers in a circle
      parameters:
        - name: circle_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Triggers in the circle
          content:
            application/json:
              schema:
                type: object
                properties:
                  triggers:
                    type: array
                    items: { $ref: '#/components/schemas/Trigger' }

  /people/{person_id}/triggers:
    get:
      tags: [Triggers]
      summary: List triggers for a person
      parameters:
        - name: person_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Triggers for the person
          content:
            application/json:
              schema:
                type: object
                properties:
                  triggers:
                    type: array
                    items: { $ref: '#/components/schemas/Trigger' }

  # ── Integrations ───────────────────────────────────────────────────────
  /integrations:
    get:
      tags: [Integrations]
      summary: List integrations
      responses:
        '200':
          description: A list of integrations
          content:
            application/json:
              schema:
                type: object
                properties:
                  integrations:
                    type: array
                    items: { $ref: '#/components/schemas/Integration' }
    post:
      tags: [Integrations]
      summary: Create an integration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                integrations:
                  type: array
                  items:
                    type: object
                    properties:
                      config: { type: object }
      responses:
        '201': { description: Integration created }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /integrations/{id}:
    delete:
      tags: [Integrations]
      summary: Delete an integration
      parameters:
        - $ref: '#/components/parameters/resourceId'
      responses:
        '204': { description: Integration deleted }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-Auth-Token
      description: |
        Your GlassFrog v3 API key. Generate one in GlassFrog under
        Admin > API & Integrations.

  parameters:
    resourceId:
      name: id
      in: path
      required: true
      schema: { type: integer }
      description: Resource ID.
    page:
      name: page
      in: query
      schema: { type: integer, minimum: 1 }
      description: Page number (1-based).
    per_page:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      description: Results per page (default 30).
    include:
      name: include
      in: query
      schema: { type: string }
      description: |
        Comma-separated list of relations to sideload. Set to blank to
        disable sideloading entirely.

  responses:
    Unauthorized:
      description: API key not specified or not valid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: The action is not permitted
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnprocessableEntity:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              detail: { type: string }
              source:
                type: object
                properties:
                  field: { type: string }

    PatchOperation:
      type: object
      required: [op, path, value]
      properties:
        op:
          type: string
          enum: [replace, add, remove]
        path:
          type: string
          description: JSON Pointer to the field (e.g. `/roles/123/name`).
        value:
          description: The new value.

    LinkedResources:
      type: object
      description: Sideloaded related resources, keyed by type.
      additionalProperties:
        type: array
        items: { type: object }

    Links:
      type: object
      description: IDs of related resources.
      additionalProperties: true

    Role:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        name_with_circle_for_core_roles: { type: string }
        purpose: { type: string, nullable: true }
        organization_id: { type: integer }
        is_core: { type: boolean }
        elected_until:
          type: string
          format: date-time
          nullable: true
        tag_names:
          type: array
          items: { type: string }
        links:
          type: object
          properties:
            circle: { type: integer }
            supporting_circle: { type: integer, nullable: true }
            domains:
              type: array
              items: { type: integer }
            accountabilities:
              type: array
              items: { type: integer }
            people:
              type: array
              items: { type: integer }

    Circle:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        short_name: { type: string, nullable: true }
        strategy: { type: string, nullable: true }
        organization_id: { type: integer }
        links:
          type: object
          properties:
            roles:
              type: array
              items: { type: integer }
            policies:
              type: array
              items: { type: integer }
            domains:
              type: array
              items: { type: integer }
            supported_role: { type: integer }
            people:
              type: array
              items: { type: integer }

    Person:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        external_id: { type: string, nullable: true }
        tag_names:
          type: array
          items: { type: string }
        settings: { type: object }
        links:
          type: object
          properties:
            circles:
              type: array
              items: { type: integer }
            organizations:
              type: array
              items: { type: integer }

    Assignment:
      type: object
      properties:
        id: { type: integer }
        election: { type: boolean }
        exclude_from_meetings: { type: boolean }
        focus: { type: string, nullable: true }
        links:
          type: object
          properties:
            person: { type: integer }
            role: { type: integer }

    Project:
      type: object
      properties:
        id: { type: integer }
        description: { type: string }
        status: { type: string, enum: [current, done, future, waiting] }
        type: { type: string }
        created_at: { type: string, format: date-time }
        archived_at:
          type: string
          format: date-time
          nullable: true
        link: { type: string, nullable: true }
        value: { type: number, nullable: true }
        effort: { type: number, nullable: true }
        roi:
          nullable: true
          description: Numeric value or the string "Infinity".
        private_to_circle: { type: boolean }
        note: { type: string, nullable: true }
        waiting_on_what: { type: string, nullable: true }
        waiting_on_who: { type: string, nullable: true }
        links:
          type: object
          properties:
            person: { type: integer }
            circle: { type: integer }
            role: { type: integer, nullable: true }

    Action:
      type: object
      properties:
        id: { type: integer }
        description: { type: string }
        type: { type: string }
        status: { type: string }
        created_at: { type: string, format: date-time }
        completed_at:
          type: string
          format: date-time
          nullable: true
        note: { type: string, nullable: true }
        position: { type: integer, nullable: true }
        private_to_circle: { type: boolean }
        trigger: { type: string, nullable: true }
        trigger_event: { type: string, nullable: true }
        links:
          type: object
          properties:
            person: { type: integer }
            circle: { type: integer }
            role: { type: integer, nullable: true }
            project: { type: integer, nullable: true }

    Metric:
      type: object
      properties:
        id: { type: integer }
        description: { type: string }
        frequency: { type: string }
        link: { type: string, nullable: true }
        global: { type: boolean }
        role_name: { type: string, nullable: true }
        links:
          type: object
          properties:
            circle: { type: integer }
            role: { type: integer, nullable: true }

    ChecklistItem:
      type: object
      properties:
        id: { type: integer }
        description: { type: string }
        frequency: { type: string }
        link: { type: string, nullable: true }
        global: { type: boolean }
        role_name: { type: string, nullable: true }
        links:
          type: object
          properties:
            circle: { type: integer }
            role: { type: integer, nullable: true }

    Tension:
      type: object
      properties:
        id: { type: integer }
        body: { type: string }
        view_body: { type: string }
        plain_body: { type: string }
        label: { type: string, nullable: true }
        agenda_label: { type: string, nullable: true }
        type: { type: string }
        created_at: { type: string, format: date-time }
        impacted_role_id: { type: integer, nullable: true }
        meeting_type: { type: string, nullable: true }
        proposal_status: { type: string, nullable: true }
        is_triaged: { type: boolean }
        is_agenda_item: { type: boolean }
        is_resolved: { type: boolean }
        processed: { type: boolean }
        links:
          type: object
          properties:
            person: { type: integer }
            circle: { type: integer }
            impacted_role: { type: integer, nullable: true }
            proposal: { type: integer, nullable: true }

    CustomField:
      type: object
      properties:
        id: { type: integer }
        field_name: { type: string }
        field_value: { type: string }
        linked_field_value: { type: string }
        links:
          type: object
          properties:
            role: { type: integer }

    Domain:
      type: object
      properties:
        id: { type: integer }
        description: { type: string }

    Policy:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        body: { type: string }
        tag_names:
          type: array
          items: { type: string }
        links:
          type: object
          properties:
            role: { type: integer }
            circle: { type: integer }
            domain: { type: integer, nullable: true }

    Organization:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        preferred_locale: { type: string }
        links:
          type: object
          properties:
            circles:
              type: array
              items: { type: integer }

    GovernanceMeeting:
      type: object
      properties:
        id: { type: integer }
        started_at:
          type: string
          format: date-time
          nullable: true
        ended_at:
          type: string
          format: date-time
          nullable: true
        scratch_pad: { type: string, nullable: true }
        links:
          type: object
          properties:
            circle: { type: integer }
            person: { type: integer }
            current_agenda_item: { type: integer, nullable: true }
            current_host: { type: integer, nullable: true }
            agenda_items:
              type: array
              items: { type: integer }
            meeting_hosts:
              type: array
              items: { type: integer }

    TacticalMeeting:
      type: object
      properties:
        id: { type: integer }
        started_at:
          type: string
          format: date-time
          nullable: true
        ended_at:
          type: string
          format: date-time
          nullable: true
        scratch_pad: { type: string, nullable: true }
        links:
          type: object
          properties:
            circle: { type: integer }
            owner: { type: integer }
            current_agenda_item: { type: integer, nullable: true }
            current_host: { type: integer, nullable: true }
            agenda_items:
              type: array
              items: { type: integer }

    AgendaItem:
      type: object
      properties:
        id: { type: integer }
        label: { type: string }
        completed: { type: boolean }
        position: { type: integer }
        links:
          type: object
          properties:
            tension: { type: integer, nullable: true }
            proposal: { type: integer, nullable: true }
            person: { type: integer }
            meeting: { type: integer }

    Proposal:
      type: object
      properties:
        id: { type: integer }
        status: { type: string }
        proposed_at:
          type: string
          format: date-time
          nullable: true
        escalated_at:
          type: string
          format: date-time
          nullable: true
        accepted_at:
          type: string
          format: date-time
          nullable: true
        response_deadline:
          type: string
          format: date-time
          nullable: true
        received_response_count: { type: integer }
        expected_response_count: { type: integer }
        current_responders:
          type: array
          items: { type: integer }
        possible_responders:
          type: array
          items: { type: integer }
        instructions:
          type: array
          items: { type: object }
        links:
          type: object
          properties:
            circle: { type: integer }
            tension: { type: integer }
            person: { type: integer }

    Trigger:
      type: object
      properties:
        id: { type: integer }
        type: { type: string }
        description: { type: string }

    Integration:
      type: object
      properties:
        id: { type: integer }
        config: { type: object }
