openapi: 3.0.3
info:
  title: GlassFrog API v3
  description: |
    The GlassFrog API v3 provides programmatic access to your organization's
    Holacracy structure — roles, circles, people, projects, actions, and more.

    ## Authentication

    All requests require an API key passed via the `X-Auth-Token` header
    (or `api_key` query parameter, though the header is preferred):

    ```
    X-Auth-Token: your_api_key_here
    ```

    API keys are generated per-organization in GlassFrog under
    **Admin > API & Integrations**.

    ## Organization Scoping

    Requests are scoped to the organization associated with your API key.
    You may optionally use the `/api/v3/org/{organization_id}/...` path
    prefix to explicitly scope requests, but this is not required.

    ## Response Format

    Responses wrap resources in a root key matching the resource type:

    ```json
    {
      "roles": [
        {
          "id": 123,
          "name": "Marketing",
          "links": { "circle": 456, "people": [1, 2] }
        }
      ],
      "linked": {
        "circles": [...],
        "people": [...]
      }
    }
    ```

    - **`links`** — IDs of related resources, embedded in each object.
    - **`linked`** — Sideloaded related resources (when `include` is not
      set to blank). Control sideloading with `?include=` (comma-separated
      relation names, or blank to disable).

    ## Pagination

    List endpoints accept `page` (1-based) and `per_page` (default 30)
    query parameters.

    ## Sorting

    Use `?sort=field` for ascending or `?sort=-field` for descending.
    Multiple fields can be comma-separated.

    ## Filtering

    Most list endpoints support `created_since`, `updated_since`,
    `created_before`, and `created_after` (ISO 8601 timestamps) as
    universal filters. Resource-specific filters are documented per endpoint.

    ## PATCH Operations

    PATCH endpoints accept a JSON Patch body (RFC 6902) — an array of
    operation objects:

    ```json
    [
      { "op": "replace", "path": "/roles/123/name", "value": "New Name" }
    ]
    ```

    ## Errors

    Error responses include a `message` and an `errors` array:

    ```json
    {
      "message": "there was a problem",
      "errors": [
        { "title": "there was a problem" }
      ]
    }
    ```

    Common status codes: `401` (invalid API key), `403` (forbidden),
    `404` (not found), `422` (validation error), `409` (conflict).
  version: '3.0'
  contact:
    name: GlassFrog Support
    url: https://support.glassfrog.com

servers:
  - url: /api/v3
    description: GlassFrog v3 API (relative)

security:
  - apiKey: []

tags:
  - name: Roles
    description: Roles define purpose, accountabilities, and domains within circles.
  - name: Circles
    description: Circles are self-organizing teams. Each circle has a set of roles.
  - name: People
    description: People are members of your organization who fill roles.
  - name: Assignments
    description: Assignments link people to roles.
  - name: Projects
    description: Projects track work owned by a role or person.
  - name: Actions
    description: Actions are next-action items owned by a person and role.
  - name: Metrics
    description: Metrics track recurring data reported in tactical meetings.
  - name: Checklist Items
    description: Checklist items track recurring yes/no items for tactical meetings.
  - name: Tensions
    description: Tensions capture gaps between current reality and potential.
  - name: Custom Fields
    description: Custom key-value fields on roles.
  - name: Domains
    description: Domains define exclusive authority granted to a role.
  - name: Policies
    description: Policies define rules or grants of access around a domain.
  - name: Organizations
    description: Organization-level data.
  - name: Governance Meetings
    description: Governance meetings for processing proposals.
  - name: Tactical Meetings
    description: Tactical meetings for operational sync.
  - name: Agenda Items
    description: Agenda items within meetings.
  - name: Proposals
    description: Governance proposals for role/circle changes.
  - name: Triggers
    description: Triggers available for actions and projects.
  - name: Integrations
    description: Third-party integrations.

paths:
  # ── Roles ──────────────────────────────────────────────────────────────
  /roles:
    get:
      tags: [Roles]
      summary: List roles
      description: |
        Returns all roles in the organization. Optionally filter by circle
        or person.
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/include'
        - name: circle_id
          in: query
          schema: { type: integer }
          description: Filter roles belonging to a specific circle.
        - name: person_id
          in: query
          schema: { type: integer }
          description: Filter roles assigned to a specific person.
        - name: filter
          in: query
          schema: { type: string, enum: [noFillers] }
          description: Set to `noFillers` to return only unfilled roles.
      responses:
        '200':
          description: A list of roles
          content:
            application/json:
              schema:
                type: object
                properties:
                  roles:
                    type: array
                    items: { $ref: '#/components/schemas/Role' }
                  linked:
                    $ref: '#/components/schemas/LinkedResources'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /roles/{id}:
    get:
      tags: [Roles]
      summary: Get a role
      parameters:
        - $ref: '#/components/parameters/resourceId'
        - $ref: '#/components/parameters/include'
      responses:
        '200':
          description: A single role
          content:
            application/json:
              schema:
                type: object
                properties:
                  roles:
                    type: array
                    items: { $ref: '#/components/schemas/Role' }
                    minItems: 1
                    maxItems: 1
                  linked:
                    $ref: '#/components/schemas/LinkedResources'
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Roles]
      summary: Update a role
      description: Update role attributes such as tag names. Uses JSON Patch format.
      parameters:
        - $ref: '#/components/parameters/resourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/PatchOperation' }
      responses:
        '204': { description: Role updated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /circles/{circle_id}/roles:
    get:
      tags: [Roles]
      summary: List roles in a circle
      parameters:
        - name: circle_id
          in: path
          required: true
          schema: { type: integer }
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/include'
      responses:
        '200':
          description: Roles in the circle
          content:
            application/json:
              schema:
                type: object
                properties:
                  roles:
                    type: array
                    items: { $ref: '#/components/schemas/Role' }
                  linked:
                    $ref: '#/components/schemas/LinkedResources'

  /people/{person_id}/roles:
    get:
      tags: [Roles]
      summary: List roles assigned to a person
      parameters:
        - name: person_id
          in: path
          required: true
          schema: { type: integer }
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/include'
      responses:
        '200':
          description: Roles assigned to the person
          content:
            application/json:
              schema:
                type: object
                properties:
                  roles:
                    type: array
                    items: { $ref: '#/components/schemas/Role' }
                  linked:
                    $ref: '#/components/schemas/LinkedResources'

  # ── Circles ────────────────────────────────────────────────────────────
  /circles:
    get:
      tags: [Circles]
      summary: List circles
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/include'
      responses:
        '200':
          description: A list of circles
          content:
            application/json:
              schema:
                type: object
                properties:
                  circles:
                    type: array
                    items: { $ref: '#/components/schemas/Circle' }
                  linked:
                    $ref: '#/components/schemas/LinkedResources'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /circles/{id}:
    get:
      tags: [Circles]
      summary: Get a circle
      parameters:
        - $ref: '#/components/parameters/resourceId'
        - $ref: '#/components/parameters/include'
      responses:
        '200':
          description: A single circle
          content:
            application/json:
              schema:
                type: object
                properties:
                  circles:
                    type: array
                    items: { $ref: '#/components/schemas/Circle' }
                    minItems: 1
                    maxItems: 1
                  linked:
                    $ref: '#/components/schemas/LinkedResources'
        '404': { $ref: '#/components/responses/NotFound' }

  /circles/{circle_id}/members/{person_id}:
    post:
      tags: [Circles]
      summary: Add a member to a circle
      description: Assigns a person to the circle's member role.
      parameters:
        - name: circle_id
          in: path
          required: true
          schema: { type: integer }
        - name: person_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '201': { description: Member added }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── People ─────────────────────────────────────────────────────────────
  /people:
    get:
      tags: [People]
      summary: List people
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/include'
        - name: circle_id
          in: query
          schema: { type: integer }
          description: Filter people with roles in this circle.
        - name: role
          in: query
          schema:
            type: string
            enum: [lead_link, rep_link, secretary, facilitator]
          description: Filter people filling a specific core role type.
      responses:
        '200':
          description: A list of people
          content:
            application/json:
              schema:
                type: object
                properties:
                  people:
                    type: array
                    items: { $ref: '#/components/schemas/Person' }
                  linked:
                    $ref: '#/components/schemas/LinkedResources'
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [People]
      summary: Create a person
      description: Invite a new person to the organization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                people:
                  type: array
                  items:
                    type: object
                    required: [name, email]
                    properties:
                      name: { type: string }
                      email: { type: string, format: email }
                      external_id: { type: string }
                      tag_names: { type: array, items: { type: string } }
      responses:
        '201':
          description: Person created
          content:
            application/json:
              schema:
                type: object
                properties:
                  people:
                    type: array
                    items: { $ref: '#/components/schemas/Person' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /people/{id}:
    get:
      tags: [People]
      summary: Get a person
      description: Use `id=me` to get the authenticated person.
      parameters:
        - $ref: '#/components/parameters/resourceId'
        - $ref: '#/components/parameters/include'
      responses:
        '200':
          description: A single person
          content:
            application/json:
              schema:
                type: object
                properties:
                  people:
                    type: array
                    items: { $ref: '#/components/schemas/Person' }
                    minItems: 1
                    maxItems: 1
                  linked:
                    $ref: '#/components/schemas/LinkedResources'
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [People]
      summary: Update a person
      parameters:
        - $ref: '#/components/parameters/resourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/PatchOperation' }
      responses:
        '204': { description: Person updated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    delete:
      tags: [People]
      summary: Remove a person
      description: Removes the person from the organization.
      parameters:
        - $ref: '#/components/parameters/resourceId'
      responses:
        '204': { description: Person removed }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /circles/{circle_id}/people:
    get:
      tags: [People]
      summary: List people in a circle
      parameters:
        - name: circle_id
          in: path
          required: true
          schema: { type: integer }
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/include'
      responses:
        '200':
          description: People with roles in the circle
          content:
            application/json:
              schema:
                type: object
                properties:
                  people:
                    type: array
                    items: { $ref: '#/components/schemas/Person' }
                  linked:
                    $ref: '#/components/schemas/LinkedResources'

  # ── Assignments ────────────────────────────────────────────────────────
  /assignments:
    get:
      tags: [Assignments]
      summary: List assignments
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/include'
        - name: person_id
          in: query
          schema: { type: integer }
          description: Filter assignments for a person.
        - name: role_id
          in: query
          schema: { type: integer }
          description: Filter assignments for a role.
      responses:
        '200':
          description: A list of assignments
          content:
            application/json:
              schema:
                type: object
                properties:
                  assignments:
                    type: array
                    items: { $ref: '#/components/schemas/Assignment' }
                  linked:
                    $ref: '#/components/schemas/LinkedResources'
    post:
      tags: [Assignments]
      summary: Create an assignment
      description: Assign a person to a role. Cannot assign to elected roles.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assignments:
                  type: array
                  items:
                    type: object
                    required: [person_id, role_id]
                    properties:
                      person_id: { type: integer }
                      role_id: { type: integer }
                      focus: { type: string }
                      exclude_from_meetings: { type: boolean }
      responses:
        '201':
          description: Assignment created
          content:
            application/json:
              schema:
                type: object
                properties:
                  assignments:
                    type: array
                    items: { $ref: '#/components/schemas/Assignment' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /assignments/{id}:
    patch:
      tags: [Assignments]
      summary: Update an assignment
      description: |
        Update assignment attributes. Cannot change `person_id` or `role_id`.
      parameters:
        - $ref: '#/components/parameters/resourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/PatchOperation' }
      responses:
        '204': { description: Assignment updated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    delete:
      tags: [Assignments]
      summary: Delete an assignment
      parameters:
        - $ref: '#/components/parameters/resourceId'
      responses:
        '204': { description: Assignment deleted }
        '403': { $ref: '#/components/responses/Forbidden' }

  /people/{person_id}/assignments:
    get:
      tags: [Assignments]
      summary: List assignments for a person
      parameters:
        - name: person_id
          in: path
          required: true
          schema: { type: integer }
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
      responses:
        '200':
          description: Assignments for the person
          content:
            application/json:
              schema:
                type: object
                properties:
                  assignments:
                    type: array
                    items: { $ref: '#/components/schemas/Assignment' }

  /roles/{role_id}/assignments:
    get:
      tags: [Assignments]
      summary: List assignments for a role
      parameters:
        - name: role_id
          in: path
          required: true
          schema: { type: integer }
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
      responses:
        '200':
          description: Assignments for the role
          content:
            application/json:
              schema:
                type: object
                properties:
                  assignments:
                    type: array
                    items: { $ref: '#/components/schemas/Assignment' }

  # ── Projects ───────────────────────────────────────────────────────────
  /projects:
    get:
      tags: [Projects]
      summary: List projects
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/include'
        - name: circle_id
          in: query
          schema: { type: integer }
          description: Filter projects by circle.
        - name: role_id
          in: query
          schema: { type: integer }
          description: Filter projects by owner role.
        - name: person_id
          in: query
          schema: { type: integer }
          description: Filter projects by owner person.
        - name: status
          in: query
          schema: { type: string }
          description: |
            Filter by status. Comma-separated list of: `current`, `done`,
            `future`, `waiting`. Defaults to `current,future,waiting`.
        - name: keyword
          in: query
          schema: { type: string }
          description: Search in project descriptions (case-insensitive).
        - name: circles
          in: query
          schema: { type: string, enum: [all, my] }
          description: >
            `all` for all org circles, `my` for circles the API key owner belongs to.
      responses:
        '200':
          description: A list of projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items: { $ref: '#/components/schemas/Project' }
                  linked:
                    $ref: '#/components/schemas/LinkedResources'
    post:
      tags: [Projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                projects:
                  type: array
                  items:
                    type: object
                    required: [description]
                    properties:
                      description: { type: string }
                      status: { type: string, enum: [current, done, future, waiting] }
                      circle_id: { type: integer }
                      role_id: { type: integer }
                      person_id: { type: integer }
                      link: { type: string }
                      value: { type: number }
                      effort: { type: number }
                      private_to_circle: { type: boolean }
                      note: { type: string }
                      waiting_on_what: { type: string }
                      waiting_on_who: { type: string }
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items: { $ref: '#/components/schemas/Project' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /projects/{id}:
    get:
      tags: [Projects]
      summary: Get a project
      parameters:
        - $ref: '#/components/parameters/resourceId'
        - $ref: '#/components/parameters/include'
      responses:
        '200':
          description: A single project
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items: { $ref: '#/components/schemas/Project' }
                    minItems: 1
                    maxItems: 1
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Projects]
      summary: Update a project
      parameters:
        - $ref: '#/components/parameters/resourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/PatchOperation' }
      responses:
        '204': { description: Project updated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    delete:
      tags: [Projects]
      summary: Delete a project
      parameters:
        - $ref: '#/components/parameters/resourceId'
      responses:
        '204': { description: Project deleted }
        '403': { $ref: '#/components/responses/Forbidden' }

  /circles/{circle_id}/projects:
    get:
      tags: [Projects]
      summary: List projects in a circle
      parameters:
        - name: circle_id
          in: path
          required: true
          schema: { type: integer }
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/include'
      responses:
        '200':
          description: Projects in the circle
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items: { $ref: '#/components/schemas/Project' }

  /roles/{role_id}/projects:
    get:
      tags: [Projects]
      summary: List projects for a role
      parameters:
        - name: role_id
          in: path
          required: true
          schema: { type: integer }
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/include'
      responses:
        '200':
          description: Projects owned by the role
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items: { $ref: '#/components/schemas/Project' }

  # ── Actions ────────────────────────────────────────────────────────────
  /actions:
    get:
      tags: [Actions]
      summary: List actions
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/include'
        - name: person_id
          in: query
          schema: { type: integer }
          description: Filter actions by person.
        - name: exclude_completed
          in: query
          schema: { type: boolean }
          description: Exclude completed actions. Defaults to `true`.
      responses:
        '200':
          description: A list of actions
          content:
            application/json:
              schema:
                type: object
                properties:
                  actions:
                    type: array
                    items: { $ref: '#/components/schemas/Action' }
                  linked:
                    $ref: '#/components/schemas/LinkedResources'
    post:
      tags: [Actions]
      summary: Create an action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                actions:
                  type: array
                  items:
                    type: object
                    required: [description]
                    properties:
                      description: { type: string }
                      circle_id: { type: integer }
                      role_id: { type: integer }
                      person_id: { type: integer }
                      project_id: { type: integer }
                      private_to_circle: { type: boolean }
                      trigger: { type: string }
                      trigger_event: { type: string }
                      note: { type: string }
      responses:
        '201':
          description: Action created
          content:
            application/json:
              schema:
                type: object
                properties:
                  actions:
                    type: array
                    items: { $ref: '#/components/schemas/Action' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /actions/{id}:
    get:
      tags: [Actions]
      summary: Get an action
      parameters:
        - $ref: '#/components/parameters/resourceId'
        - $ref: '#/components/parameters/include'
      responses:
        '200':
          description: A single action
          content:
            application/json:
              schema:
                type: object
                properties:
                  actions:
                    type: array
                    items: { $ref: '#/components/schemas/Action' }
                    minItems: 1
                    maxItems: 1
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Actions]
      summary: Update an action
      parameters:
        - $ref: '#/components/parameters/resourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/PatchOperation' }
      responses:
        '204': { description: Action updated }
