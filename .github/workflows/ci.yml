name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: todoist_sync
          POSTGRES_PASSWORD: todoist_sync
          POSTGRES_DB: todoist_sync
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U todoist_sync"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://todoist_sync:todoist_sync@localhost:5432/todoist_sync
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-secret-value-that-is-at-least-32-chars
      BETTER_AUTH_URL: http://localhost:5173
      TODOIST_CLIENT_ID: ci-client-id
      TODOIST_CLIENT_SECRET: ci-client-secret
      TODOIST_REDIRECT_URI: http://localhost:5173/oauth/todoist/callback

    steps:
      - uses: actions/checkout@v5

      # Corepack reads the pinned Yarn version from package.json's
      # `packageManager` field, so setup-node's yarn cache resolves correctly.
      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --immutable

      - name: Apply migrations
        run: yarn db:migrate

      - name: Lint and typecheck
        run: yarn check

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build
